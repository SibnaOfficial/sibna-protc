name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly: run extended security checks
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === FAST CHECKS (run on every push/PR) ===
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sibna-core --features p2p,pqc,argon2,ffi -- -D warnings
      - run: cargo clippy -p sibna-server -- -D warnings
      - run: cargo clippy -p sibna-tests -- -D warnings

  test-core:
    name: Core Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib

  test-proptest:
    name: Property-Based Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run proptest property tests
        run: cargo test -p sibna-core --test proptest_properties -- --nocapture

  build-verify:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sibna-core --features p2p,pqc,argon2,ffi
      - run: cargo build -p sibna-server
      - run: cargo build -p sibna-core --no-default-features

  # === SDK: PYTHON (sole official SDK) ===
  sdk-python:
    name: Python SDK
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Linting & formatting
      - run: pip install black mypy
      - run: cd sdks/python && black --check sibna tests
      - run: cd sdks/python && mypy sibna
      # Unit + protocol-conformance tests
      - run: cd sdks/python && pip install -e ".[dev]"
      - run: cd sdks/python && python -m pytest tests/ -v
      # Version consistency (protocol, Rust workspace, Python package)
      - run: python scripts/version_check.py
      # Package build + clean installation + smoke test
      - run: cd sdks/python && python -m build
      - run: cd sdks/python && pip install dist/sibna-*.whl
      - run: cd sdks/python && python -c "
            import sibna
            from sibna import Session, PreKeyBundle, X25519KeyPair, Ed25519KeyPair, derive_identity_keys
            ed, x = derive_identity_keys(b'\\x01' * 32)
            assert len(x.public_key) == 32
            print('sibna smoke test OK')
        "

  # === RUST-PYTHON INTEROP (run on every push/PR) ===
  interop:
    name: Rust-Python Interop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ".[dev]"
        working-directory: sdks/python
      - name: Run interop tests (Linux/macOS)
        run: bash run_interop.sh
        if: ${{ matrix.os != 'windows-latest' }}
      - name: Run interop tests (Windows)
        run: powershell -ExecutionPolicy Bypass -File .\run_interop.ps1
        if: ${{ matrix.os == 'windows-latest' }}

  # === SECURITY AUDITS (run on every push/PR) ===
  audit-deny:
    name: Security Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  audit-vulnerabilities:
    name: Vulnerability Scan (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        continue-on-error: false

  # === NATIVE LIBRARY BUILD ===
  build-native:
    name: Build Native Library
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    outputs:
      lib-path: ${{ steps.build.outputs.lib-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native library
        id: build
        run: |
          cargo build --release -p sibna-core --features p2p,pqc,argon2,ffi
          echo "lib-path=$(pwd)/target/release" >> $GITHUB_OUTPUT
        shell: bash
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: sibna-native-lib-${{ matrix.os }}
          path: |
            target/release/libsibna*.so
            target/release/libsibna*.dylib
            target/release/libsibna*.dll
          retention-days: 1

  # === SERVER TESTS (cross-platform) ===
  test-server:
    name: Server Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sibna-server --test aggressive_tests
        env:
          SIBNA_JWT_SECRET: ${{ secrets.SIBNA_JWT_SECRET || 'ci_test_secret_for_audit_only_not_production' }}

  # === HEAVY CHECKS (weekly schedule only) ===
  test-offensive:
    name: Offensive Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sibna-core --test offensive_test
      - run: cargo test -p sibna-core --test advanced_offensive_test

  test-attack:
    name: Security Audit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sibna-server
      - run: cargo test -p sibna-core --test attack_tests
        env:
          SIBNA_JWT_SECRET: ${{ secrets.SIBNA_JWT_SECRET || 'ci_test_secret_for_audit_only_not_production' }}

  dependency-check:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-outdated --locked
      - run: cargo outdated --root-deps-only

  # === FUZZING (weekly + PRs to security-sensitive code) ===
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets (short)
        run: |
          cd core
          for target in fuzz_crypto_encrypt fuzz_ratchet_decrypt fuzz_handshake_x3dh fuzz_padding; do
            echo "=== Running $target ==="
            timeout 120 cargo fuzz run $target -- -max_total_time=20 -runs=0 || true
          done

  # === MODEL CHECKING (weekly only - very slow) ===
  kani:
    name: Kani Model Checking
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CBMC
        run: |
          wget -q https://github.com/diffblue/cbmc/releases/download/cbmc-5.94.0/cbmc-5.94.0-linux-x86_64.tar.gz
          tar -xzf cbmc-5.94.0-linux-x86_64.tar.gz
          sudo cp cbmc-5.94.0-linux-x86_64/bin/cbmc /usr/local/bin/
          sudo cp cbmc-5.94.0-linux-x86_64/bin/goto-cc /usr/local/bin/
          sudo cp cbmc-5.94.0-linux-x86_64/bin/goto-instrument /usr/local/bin/
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani --setup
      - name: Run Kani harnesses
        run: |
          cd core
          for harness in kani_ratchet_replay_detection kani_handshake_role_determination kani_serialize_deserialize_state; do
            echo "=== Running $harness ==="
            cargo kani --harness $harness --default-unwind 10 2>&1 | tail -20
          done

  miri:
    name: MIRI UB Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run MIRI (core library tests only)
        run: cargo miri test -p sibna-core --lib 2>&1 | tail -100










