name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly: run extended security checks

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sibna-core --features p2p,pqc,argon2,ffi -- -D warnings
      - run: cargo clippy -p sibna-server -- -D warnings
      - run: cargo clippy -p sibna-tests -- -D warnings

  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --test integration_tests -- --skip test_mdns_discovery
      - run: cargo test --workspace --test multi_device_tests
      - run: cargo test --workspace --test integration

  test-offensive:
    name: Offensive Tests
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --test offensive_test
      - run: cargo test --workspace --test advanced_offensive_test

  test-attack:
    name: Security Audit Tests
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sibna-server
      - run: cargo test --workspace --test attack_tests
        env:
          SIBNA_JWT_SECRET: ${{ secrets.SIBNA_JWT_SECRET || 'ci_test_secret_for_audit_only_not_production' }}

  test-proptest:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --test proptest_properties -- --nocapture

  test-sdk-python:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r sdks/python/requirements.txt
      - run: cd sdks/python && pip install -e . --no-deps && pytest tests/ -v

  test-sdk-javascript:
    name: JavaScript SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd sdks/javascript && npm install
      - run: cd sdks/javascript && npm test

  test-sdk-go:
    name: Go SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: cd sdks/go && go test -v ./...

  audit:
    name: Security Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses sources bans advisories

  cargo-audit:
    name: Vulnerability Scan (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit
      - run: cargo audit --deny warnings --config audit.toml

  dependency-check:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-outdated
      - run: cargo outdated --exit-code 1 --root-deps-only

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz
      - name: Run fuzz targets (short)
        run: |
          cd core
          for target in fuzz_crypto_encrypt fuzz_ratchet_decrypt fuzz_handshake_x3dh fuzz_padding; do
            echo "=== Running $target ==="
            timeout 120 cargo fuzz run $target -- -max_total_time=30 -runs=0 || true
          done

  kani:
    name: Kani Model Checking
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CBMC
        run: |
          wget -q https://github.com/diffblue/cbmc/releases/download/cbmc-5.94.0/cbmc-5.94.0-linux-x86_64.tar.gz
          tar -xzf cbmc-5.94.0-linux-x86_64.tar.gz
          sudo cp cbmc-5.94.0-linux-x86_64/bin/cbmc /usr/local/bin/
          sudo cp cbmc-5.94.0-linux-x86_64/bin/goto-cc /usr/local/bin/
          sudo cp cbmc-5.94.0-linux-x86_64/bin/goto-instrument /usr/local/bin/
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani --setup
      - name: Run Kani harnesses
        run: |
          cd core
          for harness in kani_ratchet_replay_detection kani_handshake_role_determination kani_serialize_deserialize_state kani_ratchet_encrypt_decrypt_roundtrip; do
            echo "=== Running $harness ==="
            cargo kani --harness $harness --default-unwind 12 2>&1 | tail -30
          done

  miri:
    name: MIRI UB Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run MIRI (library tests only)
        run: cargo miri test --workspace --lib 2>&1 | head -200

  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sibna-core --features p2p,pqc,argon2,ffi
      - run: cargo build -p sibna-server
      - run: cargo build -p sibna-core --no-default-features